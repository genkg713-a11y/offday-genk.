<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061b2a">

<title>OFFDAY GENK — Countdown</title>

<style>
:root {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;

  background-color: #061b2a;

  /* GAMBAR CADANGAN JIKA VIDEO BELUM TERSEDIA */
  background-image:
    url("https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=2400&q=90");

  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
}

/* =================================
   BACKGROUND VIDEO AIR BERGERAK
================================= */

#waterBackground {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: center;

  z-index: 0;
  pointer-events: none;
}

/* LAPISAN GELAP AGAR TULISAN JELAS */

.shade {
  position: fixed;
  inset: 0;
  z-index: 1;

  background:
    linear-gradient(
      180deg,
      rgba(2, 12, 25, 0.40),
      rgba(1, 10, 18, 0.58)
    ),
    radial-gradient(
      ellipse at center,
      transparent 10%,
      rgba(0, 0, 0, 0.30)
    );

  pointer-events: none;
}

/* =================================
   LAYOUT UTAMA
================================= */

main {
  position: relative;
  z-index: 2;

  width: min(1100px, 94vw);
  margin: auto;
  padding: 70px 24px 35px;

  text-align: center;
}

/* =================================
   WARNA NEON RGB
================================= */

@keyframes rainbowGenk {
  0% {
    color: #00ffff;
  }

  16% {
    color: #00ff88;
  }

  32% {
    color: #d4ff00;
  }

  48% {
    color: #fff000;
  }

  64% {
    color: #ff40e8;
  }

  80% {
    color: #ff3030;
  }

  100% {
    color: #00ffff;
  }
}

/* =================================
   JUDUL OFFDAY GENK
================================= */

@keyframes kedipGenk {
  0%, 100% {
    opacity: 1;
    filter: brightness(1.2);
  }

  50% {
    opacity: 0.68;
    filter: brightness(0.85);
  }
}

h1 {
  margin: 0 0 16px;

  font-size: clamp(40px, 9vw, 100px);
  line-height: 1.05;
  font-weight: 1000;
  letter-spacing: 0.035em;

  color: #00ff88;

  animation:
    rainbowGenk 6s linear infinite,
    kedipGenk 1.2s ease-in-out infinite;

  text-shadow:
    0 0 8px currentColor,
    0 0 20px currentColor,
    0 0 40px currentColor,
    0 8px 28px rgba(0, 0, 0, 0.7);
}

/* =================================
   TANGGAL TARGET
================================= */

@keyframes kedipTanggal {
  0%, 100% {
    opacity: 1;

    text-shadow:
      0 0 8px currentColor,
      0 0 20px currentColor,
      0 2px 12px #000;
  }

  50% {
    opacity: 0.65;

    text-shadow:
      0 0 3px currentColor,
      0 2px 12px #000;
  }
}

.target {
  margin: 12px 0 26px;

  font-size: clamp(16px, 2.3vw, 27px);
  font-weight: 700;

  animation:
    rainbowGenk 6s linear infinite,
    kedipTanggal 1.5s ease-in-out infinite;
}

/* =================================
   GRID COUNTDOWN
================================= */

.timer {
  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: clamp(8px, 2vw, 22px);
}

/* =================================
   KOTAK TRANSPARAN RGB
================================= */

@keyframes borderGenk {
  0% {
    border-color: rgba(0, 255, 255, 0.55);
    box-shadow: 0 0 14px rgba(0, 255, 255, 0.12);
  }

  25% {
    border-color: rgba(0, 255, 136, 0.55);
    box-shadow: 0 0 14px rgba(0, 255, 136, 0.12);
  }

  50% {
    border-color: rgba(255, 0, 255, 0.55);
    box-shadow: 0 0 14px rgba(255, 0, 255, 0.12);
  }

  75% {
    border-color: rgba(255, 50, 50, 0.55);
    box-shadow: 0 0 14px rgba(255, 50, 50, 0.12);
  }

  100% {
    border-color: rgba(0, 255, 255, 0.55);
    box-shadow: 0 0 14px rgba(0, 255, 255, 0.12);
  }
}

.unit {
  min-width: 0;

  padding: clamp(12px, 2.4vw, 28px) 8px;

  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 18px;

  /* KOTAK BENING, AIR TERLIHAT DI BELAKANG */
  background: rgba(3, 15, 25, 0.12);

  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);

  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);

  animation: borderGenk 6s linear infinite;

  transition:
    transform 0.3s ease,
    background 0.3s ease;
}

.unit:hover {
  transform: translateY(-4px);

  background: rgba(255, 255, 255, 0.08);
}

/* =================================
   ANGKA COUNTDOWN RGB BERKEDIP
================================= */

@keyframes kedipAngka {
  0%, 100% {
    opacity: 1;
    filter: brightness(1.25);

    text-shadow:
      0 0 8px currentColor,
      0 0 18px currentColor,
      0 0 35px currentColor,
      0 4px 12px rgba(0, 0, 0, 0.7);
  }

  50% {
    opacity: 0.55;
    filter: brightness(0.8);

    text-shadow:
      0 0 3px currentColor,
      0 0 8px currentColor,
      0 4px 12px rgba(0, 0, 0, 0.7);
  }
}

.num {
  display: block;

  font-variant-numeric: tabular-nums;

  font-size: clamp(32px, 7vw, 82px);
  font-weight: 900;
  line-height: 1.1;

  animation:
    rainbowGenk 6s linear infinite,
    kedipAngka 1.1s ease-in-out infinite;
}

/* =================================
   LABEL HARI JAM MENIT DETIK
================================= */

.label {
  display: block;

  margin-top: 8px;

  font-size: clamp(10px, 1.5vw, 17px);
  letter-spacing: 0.16em;
  font-weight: 700;

  color: #fff;

  text-shadow:
    0 0 8px rgba(255, 255, 255, 0.65),
    0 2px 8px #000;
}

/* =================================
   FOOTER
================================= */

.footer {
  margin-top: 26px;

  font-size: clamp(12px, 1.7vw, 20px);
  letter-spacing: 0.16em;
  font-weight: 700;

  text-shadow: 0 2px 12px #000;
}

.hint {
  margin-top: 14px;

  opacity: 0.85;
  font-size: 12px;

  text-shadow: 0 2px 8px #000;
}

/* =================================
   TOMBOL LAYAR PENUH
================================= */

.controls {
  position: fixed;
  top: 16px;
  right: 16px;

  z-index: 5;
}

button {
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 999px;

  color: white;
  background: rgba(0, 0, 0, 0.4);

  padding: 10px 14px;

  font-weight: 700;
  cursor: pointer;

  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);

  transition: 0.25s ease;
}

button:hover {
  background: rgba(255, 255, 255, 0.15);

  border-color: #00ffff;

  box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
}

button:focus-visible {
  outline: 2px solid white;
  outline-offset: 3px;
}

/* =================================
   TAMPILAN HP
================================= */

@media (max-width: 560px) {
  body {
    background-attachment: scroll;
  }

  main {
    width: 96vw;
    padding: 76px 8px 24px;
  }

  h1 {
    font-size: clamp(34px, 10vw, 54px);
    letter-spacing: 0.01em;
  }

  .target {
    margin-bottom: 22px;
  }

  .timer {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));

    gap: 12px;
  }

  .unit {
    padding: 18px 8px;
    border-radius: 14px;
  }

  .num {
    font-size: clamp(38px, 10vw, 58px);
  }

  .footer {
    line-height: 1.7;
  }

  .controls {
    top: 10px;
    right: 10px;
  }

  button {
    padding: 9px 12px;
    font-size: 12px;
  }
}

/* =================================
   AKSESIBILITAS
================================= */

@media (prefers-reduced-motion: reduce) {
  h1,
  .target,
  .num,
  .unit {
    animation: none;
  }
}
</style>
</head>

<body>

<!-- BACKGROUND VIDEO -->
<video
  id="waterBackground"
  autoplay
  muted
  loop
  playsinline
  preload="auto"
  poster="https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=2400&q=90"
  aria-hidden="true"
>
  <source src="water.mp4" type="video/mp4">
</video>

<!-- LAPISAN GELAP -->
<div class="shade" aria-hidden="true"></div>

<!-- TOMBOL LAYAR PENUH -->
<div class="controls">
  <button id="fullBtn" type="button">
    ⛶ Layar penuh
  </button>
</div>

<!-- KONTEN UTAMA -->
<main>

  <h1>OFFDAY GENK</h1>

  <div class="target" id="targetDate">
    15 NOVEMBER 2026 · 00.00 WIB
  </div>

  <section class="timer" aria-label="Hitung mundur">

    <div class="unit">
      <span class="num" id="days">000</span>
      <span class="label">HARI</span>
    </div>

    <div class="unit">
      <span class="num" id="hours">00</span>
      <span class="label">JAM</span>
    </div>

    <div class="unit">
      <span class="num" id="minutes">00</span>
      <span class="label">MENIT</span>
    </div>

    <div class="unit">
      <span class="num" id="seconds">00</span>
      <span class="label">DETIK</span>
    </div>

  </section>

  <div class="footer">
    WAKTU INDONESIA BARAT · WIB (GMT+7)
  </div>

  <div class="hint">
    Tekan F11 untuk layar penuh browser,
    atau klik tombol "Layar penuh".
  </div>

</main>

<script>
"use strict";

/* =================================
   COUNTDOWN OFFDAY GENK
   TARGET 15 NOVEMBER 2026 00.00 WIB
================================= */

const target = new Date(
  "2026-11-15T00:00:00+07:00"
).getTime();

const daysEl = document.getElementById("days");
const hoursEl = document.getElementById("hours");
const minutesEl = document.getElementById("minutes");
const secondsEl = document.getElementById("seconds");

const targetDateEl = document.getElementById("targetDate");
const fullBtn = document.getElementById("fullBtn");
const video = document.getElementById("waterBackground");

/* FORMAT ANGKA */

function pad(number, size = 2) {
  return String(number).padStart(size, "0");
}

/* UPDATE COUNTDOWN */

function updateCountdown() {
  const diff = target - Date.now();

  if (diff <= 0) {
    daysEl.textContent = "000";
    hoursEl.textContent = "00";
    minutesEl.textContent = "00";
    secondsEl.textContent = "00";

    targetDateEl.textContent =
      "15 NOVEMBER 2026 · WAKTUNYA TIBA!";

    return;
  }

  const totalSeconds = Math.floor(diff / 1000);

  const days = Math.floor(totalSeconds / 86400);

  const hours = Math.floor(
    (totalSeconds % 86400) / 3600
  );

  const minutes = Math.floor(
    (totalSeconds % 3600) / 60
  );

  const seconds = totalSeconds % 60;

  daysEl.textContent = pad(days, 3);
  hoursEl.textContent = pad(hours);
  minutesEl.textContent = pad(minutes);
  secondsEl.textContent = pad(seconds);
}

/* JALANKAN COUNTDOWN */

updateCountdown();

setInterval(updateCountdown, 1000);

/* =================================
   VIDEO AIR BERGERAK
================================= */

/* Coba putar video otomatis.
   Browser mungkin membatasi autoplay
   dalam kondisi tertentu. */

video.play().catch(() => {
  console.log(
    "Video belum bisa diputar otomatis. " +
    "Periksa apakah file water.mp4 tersedia."
  );
});

/* =================================
   TOMBOL LAYAR PENUH
================================= */

fullBtn.addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    console.error(
      "Gagal membuka layar penuh:",
      error
    );

    alert(
      "Layar penuh tidak didukung oleh browser ini."
    );
  }
});

/* UPDATE TOMBOL SAAT LAYAR PENUH */

document.addEventListener("fullscreenchange", () => {
  fullBtn.textContent = document.fullscreenElement
    ? "✕ Keluar layar penuh"
    : "⛶ Layar penuh";
});
</script>

</body>
</html>
