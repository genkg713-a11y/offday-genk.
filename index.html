<script>
"use strict";

/* TANGGAL TARGET: 15 NOVEMBER 2026, PUKUL 00.00 WIB */
const target = new Date("2026-11-15T00:00:00+07:00").getTime();

const elements = {
  days: document.getElementById("days"),
  hours: document.getElementById("hours"),
  minutes: document.getElementById("minutes"),
  seconds: document.getElementById("seconds"),
  targetDate: document.getElementById("targetDate"),
  fullBtn: document.getElementById("fullBtn")
};

const pad = (number, size = 2) =>
  String(number).padStart(size, "0");

/* UPDATE COUNTDOWN */
function updateCountdown() {
  const diff = target - Date.now();

  if (diff <= 0) {
    elements.days.textContent = "000";
    elements.hours.textContent = "00";
    elements.minutes.textContent = "00";
    elements.seconds.textContent = "00";

    elements.targetDate.textContent = "15 NOVEMBER 2026";

    return;
  }

  const totalSeconds = Math.floor(diff / 1000);

  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  elements.days.textContent = pad(days, 3);
  elements.hours.textContent = pad(hours);
  elements.minutes.textContent = pad(minutes);
  elements.seconds.textContent = pad(seconds);
}
