
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#061b2a">
<title>OFFDAY GENK — Countdown</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; font-family:Arial,Helvetica,sans-serif; background:#061b2a; }
  body {
    background-image:
      linear-gradient(180deg, rgba(2,12,25,.35) 0%, rgba(2,12,25,.18) 38%, rgba(1,10,18,.72) 100%),
      url("https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=2400&q=90");
    background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .shade { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 10%, rgba(0,0,0,.35) 100%); pointer-events:none; }
  main { position:relative; z-index:1; width:min(1100px,94vw); text-align:center; padding:24px; }
  .eyebrow { letter-spacing:.35em; font-size:clamp(12px,1.5vw,18px); font-weight:700; text-shadow:0 2px 12px #000; }
  h1 { margin:12px 0 8px; font-size:clamp(42px,9vw,112px); line-height:.98; font-weight:1000; letter-spacing:.04em; color:#ff2525; text-shadow:0 4px 0 #710000, 0 8px 28px rgba(0,0,0,.7); }
  .target { margin:18px 0 30px; font-size:clamp(16px,2.3vw,27px); font-weight:700; text-shadow:0 2px 12px #000; }
  .timer { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:clamp(8px,2vw,22px); }
  .unit { padding:clamp(12px,2.4vw,28px) 8px; border:1px solid rgba(255,255,255,.48); border-radius:18px; background:rgba(3,15,25,.58); box-shadow:0 12px 40px rgba(0,0,0,.25); backdrop-filter:blur(7px); }
  .num { display:block; font-variant-numeric:tabular-nums; font-size:clamp(32px,7vw,82px); font-weight:900; line-height:1.1; }
  .label { display:block; margin-top:8px; font-size:clamp(10px,1.5vw,17px); letter-spacing:.16em; font-weight:700; }
  .footer { margin-top:26px; font-size:clamp(13px,1.7vw,20px); letter-spacing:.16em; text-shadow:0 2px 12px #000; font-weight:700; }
  .controls { position:fixed; right:16px; top:16px; z-index:2; display:flex; gap:8px; }
  button { border:1px solid rgba(255,255,255,.55); border-radius:999px; color:#fff; background:rgba(0,0,0,.48); padding:10px 14px; font-weight:700; cursor:pointer; }
  button:hover { background:rgba(0,0,0,.75); }
  .hint { margin-top:14px; opacity:.85; font-size:12px; text-shadow:0 2px 8px #000; }
  @media (max-width:560px) { .timer { grid-template-columns:repeat(2,minmax(0,1fr)); } main { padding:16px 8px; } h1 { letter-spacing:.01em; } }
</style>
</head>
<body>
<div class="shade"></div>
<div class="controls">
  <button id="fullBtn" type="button">⛶ Layar penuh</button>
</div>
<main>
  <div class="eyebrow">COUNTDOWN MENUJU HARI SPESIAL</div>
  <h1>OFFDAY GENK</h1>
  <div class="target">15 NOVEMBER 2026 · 00.00 WIB</div>
  <section class="timer" aria-label="Hitung mundur">
    <div class="unit"><span class="num" id="days">000</span><span class="label">HARI</span></div>
    <div class="unit"><span class="num" id="hours">00</span><span class="label">JAM</span></div>
    <div class="unit"><span class="num" id="minutes">00</span><span class="label">MENIT</span></div>
    <div class="unit"><span class="num" id="seconds">00</span><span class="label">DETIK</span></div>
  </section>
  <div class="footer">WAKTU INDONESIA BARAT · WIB (GMT+7)</div>
  <div class="hint">Tekan F11 untuk layar penuh browser, atau klik tombol “Layar penuh”.</div>
</main>
<script>
const target = new Date("2026-11-15T00:00:00+07:00").getTime();
const pad = (n, size=2) => String(n).padStart(size, "0");

function update() {
  let diff = target - Date.now();

  if (diff <= 0) {
    document.getElementById("days").textContent = "000";
    document.getElementById("hours").textContent = "00";
    document.getElementById("minutes").textContent = "00";
    document.getElementById("seconds").textContent = "00";
    document.querySelector(".eyebrow").textContent = "HARI YANG DITUNGGU TELAH TIBA!";
    document.querySelector(".target").textContent = "15 NOVEMBER 2026";
    return;
  }

  const sec = Math.floor(diff / 1000);
  document.getElementById("days").textContent = pad(Math.floor(sec / 86400), 3);
  document.getElementById("hours").textContent = pad(Math.floor((sec % 86400) / 3600));
  document.getElementById("minutes").textContent = pad(Math.floor((sec % 3600) / 60));
  document.getElementById("seconds").textContent = pad(sec % 60);
}

async function fullscreen() {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch (e) {
    alert("Browser tidak mengizinkan layar penuh otomatis. Tekan F11 untuk layar penuh.");
  }
}

document.getElementById("fullBtn").addEventListener("click", fullscreen);

document.addEventListener("fullscreenchange", () => {
  document.getElementById("fullBtn").textContent =
    document.fullscreenElement ? "⤢ Keluar layar penuh" : "⛶ Layar penuh";
});

update();
setInterval(update, 1000);
</script>
</body>
</html>
